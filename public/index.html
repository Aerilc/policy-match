<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>政策匹配系统·公开版</title>
    <style>
      :root {
        color-scheme: light;
        /* 墨绿描金：米白纸底、墨绿主色、金只勾边点缀 */
        --bg: #f7f2e7;
        --surface: #fffdf7;
        --surface-alt: #efe8d5;
        --text: #23281f;
        --dim: #5a6650;
        --border: #ddd2b4;
        --accent: #1e4d3b;
        --accent-deep: #143627;
        --gold: #b98a1f;
        --gold-bright: #c9a227;
        --gold-soft: #f3e5bd;
        --danger: #a33327;
        --radius: 10px;
        --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      /* 触控目标至少 36px 高 */
      button, [role="button"], select, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); flex-shrink: 0; }

      .wrap { max-width: 48rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
      @media (min-width: 640px) { .wrap { padding-left: 1.5rem; padding-right: 1.5rem; } }
      .font-display { font-family: var(--font-display); }

      /* 步骤进度条 */
      .steps { display: flex; align-items: flex-start; list-style: none; margin: 0 0 0.5rem; padding: 0; }
      .steps li { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; }
      .steps .bar { position: absolute; left: -50%; top: 1.25rem; height: 2px; width: 100%; background: var(--border); }
      .steps .bar.done { background: var(--accent); }
      .step-dot {
        position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
        width: 2.5rem; height: 2.5rem; border-radius: 9999px; border: 2px solid var(--border);
        background: var(--surface); color: var(--dim);
        font-family: var(--font-display); font-size: 1rem; font-weight: 700; padding: 0;
      }
      .step-dot.current { border-color: var(--gold); background: var(--accent); color: #fff; box-shadow: 0 0 0 3px var(--gold-soft); }
      .step-dot.done { border-color: var(--accent); background: var(--accent); color: #fff; }
      .step-dot.clickable { cursor: pointer; }
      .step-label { margin-top: 0.375rem; text-align: center; font-size: 0.75rem; line-height: 1.25; color: var(--dim); }
      .step-label.current { font-weight: 700; color: var(--accent); }

      /* 双线描金分隔 */
      .gold-rule { border-top: 2px solid var(--gold); position: relative; margin: 0.75rem 0 1.5rem; }
      .gold-rule::after { content: ""; position: absolute; top: 3px; left: 0; right: 0; border-top: 1px solid var(--gold-bright); }

      h1.title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--accent-deep); margin: 0; }
      h2.zone { font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; color: var(--accent); margin: 1.5rem 0 0; }
      h2.zone.dim { color: var(--dim); }
      button.zone-toggle { background: none; border: none; padding: 0.25rem 0; cursor: pointer; text-align: left; font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; color: var(--dim); margin-top: 1.75rem; min-height: 2.25rem; }
      .intro { margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.7; color: var(--dim); }
      .note-xs { font-size: 0.75rem; line-height: 1.7; color: var(--dim); }

      .field { display: block; }
      .field > .flabel { display: block; margin-bottom: 0.375rem; font-size: 0.875rem; font-weight: 700; }
      .inp {
        width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 0.625rem 0.75rem; font-size: 1rem; color: var(--text);
        outline: none; font-family: inherit;
      }
      .inp:focus { border-color: var(--accent); }
      .inp:disabled { opacity: 0.5; }
      .stack > * + * { margin-top: 1rem; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
      @media (max-width: 560px) { .grid3 { grid-template-columns: 1fr 1fr; } }

      .btn {
        display: inline-block; border-radius: var(--radius); padding: 0.75rem 1.5rem;
        font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; line-height: 1.3;
      }
      .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
      .btn-primary:disabled { opacity: 0.5; cursor: default; }
      .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding-left: 1.25rem; padding-right: 1.25rem; }
      .btn-link { background: none; border: none; color: var(--dim); text-decoration: underline; font-size: 0.875rem; padding: 0.75rem; cursor: pointer; }
      .navrow { margin-top: 2rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
      .alert { color: var(--danger); font-size: 0.875rem; margin-top: 1rem; }
      .alert-inline { color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; }

      .warn-box { margin-top: 1rem; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: var(--radius); padding: 0.75rem 1rem; font-size: 0.75rem; line-height: 1.7; }
      .ok-box { margin-top: 1.25rem; border: 1px solid var(--accent); background: #e7efe9; border-radius: var(--radius); padding: 0.75rem 1rem; font-size: 0.875rem; line-height: 1.7; }

      /* 已获荣誉勾选 */
      fieldset.qual { border: none; margin: 0; padding: 0; }
      fieldset.qual legend { font-size: 0.875rem; font-weight: 700; padding: 0; }
      .qual-grid { margin-top: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      @media (min-width: 640px) { .qual-grid { grid-template-columns: 1fr 1fr 1fr; } }
      .qual-chip {
        display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
        border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
        padding: 0.625rem 0.75rem; font-size: 0.875rem; min-height: 2.75rem;
      }
      .qual-chip.checked { border-color: var(--accent); background: #e7efe9; font-weight: 700; color: var(--accent-deep); }

      /* 政策卡片 */
      .cards > * + * { margin-top: 0.75rem; }
      .cards { margin-top: 0.75rem; }
      .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0.75rem 1rem; }
      .card-head { display: flex; align-items: flex-start; gap: 0.5rem; }
      .card-main { flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; color: inherit; }
      .card-name { font-weight: 700; line-height: 1.45; font-size: 1rem; }
      .badge { display: inline-block; border-radius: 9999px; padding: 0.125rem 0.5rem; font-size: 0.75rem; font-weight: 700; color: #fff; vertical-align: 0.125rem; margin-left: 0.375rem; white-space: nowrap; }
      .badge.ok { background: var(--accent); }
      .badge.gap { background: var(--gold); }
      .badge.pending { background: #8a8f7d; }
      .badge.held { background: var(--accent); }
      .card-line { display: block; margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.6; color: var(--dim); }
      .card-sub { display: block; margin-top: 0.125rem; font-size: 0.75rem; line-height: 1.6; color: var(--gold); }
      .card-timing { display: block; margin-top: 0.125rem; font-size: 0.75rem; color: var(--dim); }
      .card-timing .yr { font-family: var(--font-display); font-size: 0.875rem; font-weight: 700; color: var(--gold); }
      .card-actions { display: flex; align-items: center; flex-shrink: 0; }
      .mini-btn { background: none; border: none; cursor: pointer; padding: 0.375rem 0.5rem; font-size: 0.875rem; color: var(--dim); font-family: inherit; min-width: 2.25rem; }
      .mini-btn:disabled { opacity: 0.3; cursor: default; }
      .mini-btn.remove { font-weight: 700; color: var(--danger); }
      .mini-btn.addback { font-weight: 700; color: var(--accent); }
      .card-detail { margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.75rem; font-size: 0.875rem; line-height: 1.7; }
      .card-detail p { margin: 0 0 0.5rem; }
      .card-detail ul { margin: 0 0 0.5rem; padding-left: 1.25rem; }
      .card-detail .notes { font-size: 0.75rem; color: var(--dim); }

      /* 第 5 步清单与概况 */
      .split { margin-top: 1.25rem; display: grid; gap: 1.5rem; }
      @media (min-width: 768px) { .split { grid-template-columns: 1fr 1fr; } }
      .split h2 { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--accent); margin: 0; }
      .plan-list { list-style: none; margin: 0.75rem 0 0; padding: 0; }
      .plan-list > * + * { margin-top: 0.5rem; }
      .plan-item { display: flex; align-items: baseline; gap: 0.5rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0.5rem 0.75rem; font-size: 0.875rem; }
      .plan-item .no { font-family: var(--font-display); font-weight: 700; color: var(--gold); }
      .plan-item .nm { display: block; font-weight: 700; line-height: 1.45; }
      .plan-item .meta { font-size: 0.75rem; color: var(--dim); }
      .plan-item .grow { flex: 1; min-width: 0; }
      .badge.sm { margin-left: 0; flex-shrink: 0; }
      .ov-table { margin-top: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .ov-row { display: grid; grid-template-columns: 6.5rem 1fr; border-bottom: 1px solid var(--border); background: var(--surface); }
      .ov-row:last-child { border-bottom: none; }
      .ov-row.empty { background: var(--gold-soft); }
      .ov-row dt { padding: 0.5rem 0.75rem; text-align: center; font-size: 0.75rem; font-weight: 700; line-height: 1.6; }
      .ov-row dd { margin: 0; padding: 0.5rem 0.75rem; font-size: 0.875rem; line-height: 1.6; }
      .ov-row dd .pre { white-space: pre-line; }
      .ov-fill { width: 100%; border: 1px solid var(--gold); border-radius: 6px; background: rgba(255,255,255,0.7); padding: 0.375rem 0.5rem; font-size: 0.875rem; outline: none; font-family: inherit; }
      .ov-fill:focus { border-color: var(--accent); }

      /* 撤销提示条 */
      .toast {
        position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 20; margin: 0 auto; max-width: 28rem;
        display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        background: var(--accent-deep); color: #fff; border-radius: var(--radius);
        padding: 0.75rem 1rem; font-size: 0.875rem; box-shadow: 0 10px 25px rgba(20,54,39,0.35);
      }
      .toast .tname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .toast button { background: none; border: none; color: var(--gold-bright); font-weight: 700; text-decoration: underline; cursor: pointer; flex-shrink: 0; font-size: 0.875rem; font-family: inherit; }
    </style>
  </head>

    <script>
(()=>{var G=[{name:"“5G工厂”建设项目奖励",dept:"市经信局",cat:"资金（最高200万元）",auth:"北京市经济和信息化局",time:"3—6月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向12：重点支持企业开展5G工厂建设，对形成全IPv6单栈网络环境、入选市级5G工厂名单的企业给予不超过项目网络建设总投资的30%资金奖励，单个项目奖励金额最高不超过200万元。",type:"资金",ben:"入选市级5G工厂名单的企业按网络建设总投资最高30%奖励，单项目最高200万元",inds:["制造业"],district:null,key:"::“5G工厂”建设项目奖励"},{name:"专利产品备案/专利密集型产品认定",dept:"知识产权局",cat:"资质",auth:"北京市知识产权局",time:"常态化申报（备案）、9—10月（专利密集型）",cond:"二、备案条件（一）备案主体具备独立法人资格，并应是制造、销售专利产品的专利权人或被许可人。（二）备案专利产品应至少涉及一项有效专利，且该一项或多项专利不存在权属纠纷，并已取得较好市场经济效益。（三）同一型号或品种的产品应作为一件产品进行备案，相同产品不得重复备案。",type:"资质",ben:"成本低、确定性高，把核心专利与产品对应建档，支撑小巨人知识产权关联性审查",inds:["制造业","医疗","机器人"],district:null,key:"::专利产品备案/专利密集型产品认定"},{name:"专用设备数字化智能化改造企业所得税抵免",dept:"财政部/国家税务总局",cat:"资金（改造投入10%抵免）",auth:"财政部、国家税务总局",time:"常态化申报",cond:"（一）企业在2024年1月1日至2027年12月31日期间发生的专用设备数字化、智能化改造投入，不超过该专用设备购置时原计税基础50%的部分，可按照10%比例抵免企业当年应纳税额。企业当年应纳税额不足抵免的，可以向以后年度结转，但结转年限最长不得超过五年。（二）专用设备，是指企业购置并实际使用列入《财政部 税务总局 应急管理部关于印发〈安全生产专用设备企业所得税优惠目录（2018年版）〉的通知》（财税〔2018〕84号）、《财政部 税务总局 国家发展改革委 工业和信息化部 环境保护部关于印发节能节水和环境保护专用设备企业所得税优惠目录（2017年版）的通知》（财税〔2017〕71号）的专用设备。（三）享受本公告税收优惠的改造投入，是指企业对专用设备数字化、智能化改造过程中发生的并形成该专用设备固定资产价值的支出，但不包括按有关规定退还的增值税税款以及专用设备运输、安装和调试等费用。（四）企业应对专用设备数字化、智能化改造投入进行单独核算，准确、合理归集各项支出；企业在一个纳税年度内对多个专用设备进行数字化、智能化改造的，应按照不同的专用设备分别归集相关支出。对相关支出划分不清的，不得享受本公告规定的税收优惠政策。",type:"资金",ben:"专用设备数字化、智能化改造投入可按10%抵免所得税，不足可结转5年",inds:["制造业","医疗","机器人"],district:null,key:"::专用设备数字化智能化改造企业所得税抵免"},{name:"专精特新重点“小巨人”企业",dept:"工信部",cat:"资金（三年合计最高600万元）",auth:"工业和信息化部、财政部",time:"4—6月",cond:"【原文出处】《财政部 工业和信息化部关于进一步支持专精特新中小企业高质量发展的通知》（财建〔2024〕148号）2024—2026年，聚焦重点产业链、工业“六基”及战略性新兴产业、未来产业领域（以下称重点领域），通过财政综合奖补方式，分三批次重点支持“小巨人”企业高质量发展。申请企业须为有效期内的“小巨人”企业，且未在上交所、深交所、北交所，以及境外公开发行股票，须提出“三新”、“一强”推进计划（以下称推进计划）。推进计划可覆盖“三新”、“一强”单个或多个方面，须分别提出绩效目标，投资总额需超过2000万元。对在上一轮财政支持专精特新中小企业高质量发展政策（财建〔2021〕2号文）中已获得支持的“小巨人”企业不再重复支持。",type:"资金",ben:"专精特新金字塔尖政策，中央财政奖补三年合计最高600万元，须先取得小巨人称号",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::专精特新重点“小巨人”企业"},{name:"中国专利奖",dept:"知识产权局",cat:"荣誉",auth:"国家知识产权局",time:"9—10月",cond:"(一）在2024年12月31日前（含12月31日，以授权公告日为准）被国家知识产权局授予发明、实用新型或外观设计专利权（含已解密国防专利，不含保密专利）；（二）专利权有效，在申报截止日前无法律纠纷，不存在未缴年费或滞纳金等情况；（三）全体专利权人均同意参评；（四）未获得过中国专利奖；（五）一项专利作为一个项目参评；（六）相同专利权人参评项目不超过2项。",type:"荣誉",ben:"国家级专利荣誉，是专利质量与产业化效益的国家级认可",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::中国专利奖"},{name:"中国标准创新贡献奖",dept:"国家标准化管理委员会",cat:"荣誉+资金（最高30万元）",auth:"国家标准化管理委员会",time:"按当年通知为准",cond:"中国标准创新贡献奖参评范围包括团体标准，参评标准须实施满2年。",type:"荣誉",ben:"团体标准实施满2年可参评，获奖后可申报贡献奖补助（最高30万元），与标准项目补助、标准化试点形成闭环",inds:["科技服务业"],district:null,key:"::中国标准创新贡献奖"},{name:"中小企业数字化转型/专精特新数字化赋能补助",dept:"市经信局",cat:"资金（合同额的20%，最高100万元）",auth:"北京市经信局、北京市财政局",time:"3—5月",cond:"（一）申报单位应为在本市登记注册、具有独立法人资格；（二）近三年无严重失信记录且仍在有效期范围内的北京市“专精特新”中小企业、专精特新“小巨人”企业（含国家级专精特新“小巨人”企业）。",type:"资金",ben:"按合同额20%补助、最高100万元；数字化改造投入可按比例获得补助，专精特新企业优先支持",inds:["制造业","医疗","机器人"],district:null,key:"::中小企业数字化转型/专精特新数字化赋能补助"},{name:"中试平台项目（市发改委）",dept:"发改委",cat:"资金（总投资35%，最高1亿元）",auth:"北京市发展和改革委员会",time:"常态化申报（分批联审）",cond:"《进一步提升本市中试服务能力促进科技创新和产业创新融合发展若干措施》（京发改规〔2026〕1号）：融合化方向明确含机器人与智能制造领域，符合市政府固定资产投资支持条件的新建中试平台项目（总投资原则上不低于2000万元）按项目总投资35%给予补助、最高1亿元，独立法人主体建设运营的比例提升至45%；产业化方向按项目总投入30%、最高5000万元。随有随报、定期联审。与市经信局“制造业中试平台”培育口径不同，为发改委固定资产投资补助通道。",type:"资金",ben:"发改委固投补助通道，新建中试平台按总投资35%补助、最高1亿元（独立法人运营45%），量级高于培育类支持",inds:["机器人"],district:null,key:"::中试平台项目（市发改委）"},{name:"产业链带动数字化转型奖励",dept:"市经信局",cat:"资金（最高200万元）",auth:"北京市经济和信息化局",time:"3—6月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向11：推动产业链标杆企业实施链式数字化转型，对每带动1家在京制造业企业实现数字化转型达标的产业链标杆企业，给予标杆企业不超过10万元奖励，单个产业链标杆企业累计奖励不超过200万元。",type:"资金",ben:"产业链标杆企业每带动1家在京制造业企业数字化转型达标奖励最高10万元，累计最高200万元",inds:["制造业"],district:null,key:"::产业链带动数字化转型奖励"},{name:"人工智能大模型应用补贴",dept:"市经信局",cat:"资金（最高1000万元）",auth:"北京市经济和信息化局",time:"7—8月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第二批）》方向2：重点支持信息软件业、工业企业购买非关联方的Token，开展智能体开发应用、工业智能化升级和AIGC等人工智能应用，按照最高不超过补贴期内认定的Token费用的30%予以补贴，最高不超过1000万元。",type:"资金",ben:"工业企业购买非关联方Token开展人工智能应用，按认定费用最高30%补贴、最高1000万元",inds:["制造业"],district:null,key:"::人工智能大模型应用补贴"},{name:"人形机器人与具身智能实景实训专项行动",dept:"工信部",cat:"资质",auth:"工业和信息化部、国务院国有资产监督管理委员会",time:"6月",cond:"工信部办公厅、国务院国资委办公厅《关于开展2026年度人形机器人与具身智能实景实训专项行动的通知》（工信厅联科函〔2026〕256号）：北京为试点省市之一，整机企业（或应用服务商）作为主体组建创新应用联合体进驻实景实训空间，用户单位提供场景单元，工作计划经省级工信主管部门报送。",type:"资质",ben:"国家级实景实训专项行动，联合体进驻真实场景开展实训验证，加速产品迭代与场景落地",inds:["机器人"],district:null,key:"::人形机器人与具身智能实景实训专项行动"},{name:"企业培育奖励",dept:"市经信局",cat:"资金（最高50万元）",auth:"北京市经济和信息化局",time:"5月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向22（2026年度仅限先进制造业企业）：2025年度主营业务收入首次达到2000万元且符合条件的先进制造业企业一次性奖励不超过30万元，达到1亿元且符合条件的追加奖励不超过20万元；对2026年度新建投产（开工）且当年主营业务收入首次达到2000万元、符合条件的先进制造业企业，一次性奖励不超过50万元。实行“免申即享”，企业登录“政策兑现”频道确认并填写账户信息。",type:"资金",ben:"先进制造业企业主营收入首次达2000万元最高奖励30万元、达1亿元追加20万元，新建投产达标最高50万元，免申即享",inds:["制造业"],district:null,key:"::企业培育奖励"},{name:"信息软件企业行业模型首方案奖励",dept:"市经信局",cat:"资金（已回款金额15%，最高3000万元）",auth:"北京市经济和信息化局",time:"2—4月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向7：信息软件企业行业模型首方案奖励——对首次解决重点行业典型应用场景需求、已实际落地的优质解决方案，按非硬件部分已回款金额的15%给予奖励，最高不超过3000万元（2026年批次截止5月31日）。与方向6信创首方案为两个独立方向，不可混报。指南通用条件：申报单位在本市登记注册、近3年无因违法失信行为被联合惩戒记录。",type:"资金",ben:"信息软件企业行业模型解决方案首次落地，按非硬件已回款金额15%奖励、最高3000万元",inds:["软件业"],district:null,key:"::信息软件企业行业模型首方案奖励"},{name:"先进制造业企业增值税加计抵减",dept:"财政部/国家税务总局",cat:"资金（进项税额加计5%抵减）",auth:"财政部、国家税务总局",time:"常态化申报",cond:"（一）高新技术企业中的制造业一般纳税人，高新资格在申报年度内有效；（二）企业在高新认定管理工作网填报的所属行业属《国民经济行业分类》制造业门类（C门类），制造业销售额占全部销售额50%以上；（三）研发人员、研发费用、高新产品收入占比符合高新认定办法要求；申请前36个月无骗税、虚开发票等处罚记录（以当年名单通知为准）。",type:"资金",ben:"按进项税额加计5%抵减应纳增值税，直接降低企业增值税税负",inds:["制造业","医疗","机器人"],district:null,key:"::先进制造业企业增值税加计抵减"},{name:"创新任务揭榜挂帅（人形机器人与具身智能技术专题）",dept:"工信部",cat:"资金（按任务书为准）",auth:"工业和信息化部等七部门",time:"7—8月",cond:"工信部等七部门《2026年工业和信息化领域创新任务揭榜挂帅工作》（工信厅联科函〔2026〕363号）：未来产业方向设“人形机器人与具身智能技术”专题（工信部与应急管理部共同开展），企业经省级主管部门推荐申报，攻关期至2028年；支持金额以任务书和后续支持政策为准。",type:"资金",ben:"国家级人形机器人与具身智能攻关任务，入围后获得任务书支持与国家级背书",inds:["机器人"],district:null,key:"::创新任务揭榜挂帅（人形机器人与具身智能技术专题）"},{name:"创新医疗器械产业规模化奖励",dept:"市经信局",cat:"资金（单个产品最高1000万元、单家企业最高3000万元）",auth:"北京市经济和信息化局",time:"2—4月",cond:"《北京市高精尖产业发展项目资金指南》方向3“创新医疗器械产业规模化奖励”：支持创新医疗器械产品取得注册证并实现产业化，单个产品最高1000万元、单家企业最高3000万元（具体以当年指南为准）。",type:"资金",ben:"创新医疗器械产品规模化奖励，单个产品最高1000万元、单家企业最高3000万元，加速创新器械注册落地与放量生产",inds:["医疗"],district:null,key:"::创新医疗器械产业规模化奖励"},{name:"创新医疗器械取证奖励",dept:"市经信局",cat:"资金（单产品最高200万元、单企业年度最高1000万元）",auth:"北京市经济和信息化局",time:"按当年通知为准",cond:"《北京市促进医疗器械产业高质量发展若干措施》（京经信发〔2025〕50号，有效期至2028年12月31日）第三条：对承担工信部揭榜挂帅等国家项目或进入国家和本市创新医疗器械特别审查、优先审批程序后获批上市的医疗器械产品给予一次性资金奖励，单个产品不超过200万元，单个企业年度奖励不超过1000万元。",type:"资金",ben:"创新医疗器械取证一次性奖励，单个产品最高200万元、单个企业年度最高1000万元",inds:["医疗"],district:null,key:"::创新医疗器械取证奖励"},{name:"创新医疗器械特别审查程序",dept:"国家药监局",cat:"资质",auth:"国家药品监督管理局",time:"常态化申报",cond:"国家药监局《创新医疗器械特别审查程序》（2018年第83号公告）：依法拥有核心技术发明专利、产品主要工作原理或作用机理为国内首创、技术上处于国际领先水平且具有显著临床应用价值的第二、三类医疗器械，可在首次注册申请前申请纳入特别审查程序，纳入后按“早期介入、专人负责、科学审查”原则优先审评审批。",type:"资质",ben:"国家级创新器械绿色通道，早期介入、专人负责、优先审评，缩短注册审评周期",inds:["医疗"],district:null,key:"::创新医疗器械特别审查程序"},{name:"创新药CDMO提质增效支持",dept:"市科委/中关村管委会",cat:"资金（合同金额30%，单项目累计最高1000万元）",auth:"北京市科委、中关村管委会",time:"按当年通知为准",cond:"《支持创新药合同研发生产机构提质增效的若干措施》（京科发〔2026〕3号）：医药企业委托创新药CDMO开展1类创新药工艺开发、临床试验样品制备、中试放大工艺开发、工艺验证及商业化生产等，按当年度实际交易合同金额的30%给予医药企业支持；工艺开发、Ⅰ期临床试验样品制备类单个项目累计最高500万元，中试放大工艺开发、工艺验证、Ⅱ/Ⅲ期临床试验样品制备及商业化生产类单个项目累计最高1000万元。",type:"资金",ben:"委托创新药CDMO按合同金额30%支持，单个项目累计最高500万元/1000万元，降低自建产能投入",inds:["医疗"],district:null,key:"::创新药CDMO提质增效支持"},{name:"创新药品产业规模化奖励",dept:"市经信局",cat:"资金（单品种最高1000万元、单企业最高3000万元）",auth:"北京市经济和信息化局",time:"2—4月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向2“创新药品产业规模化奖励”：支持创新药、高端仿制药及引进品种产业化规模化应用，对2025年以来1类/2类药品、国内首仿、前三个通过仿制药质量和疗效一致性评价及国家鼓励目录内新上市的本市注册生产药品等给予奖励；企业可同时申报多个品种，单个品种奖励不超过1000万元，单个企业奖励不超过3000万元。",type:"资金",ben:"创新药品产业规模化奖励，单个品种最高1000万元、单个企业最高3000万元，支持创新药与高端仿制药放量生产",inds:["医疗"],district:null,key:"::创新药品产业规模化奖励"},{name:"制造业中试平台",dept:"市经信局",cat:"资质",auth:"北京市经信局",time:"5月/11月",cond:"【原文出处】《工业和信息化部办公厅关于进一步加快制造业中试平台体系化布局和高水平建设的通知》（工信厅科函〔2025〕456号）附件3《储备中试平台基本条件和管理要求》；北京市经济和信息化局2025年11月19日储备工作通知（一）战略定位：应与国家重大战略需求、重大工程实施需要、产业发展重点领域、制造业重点产业链高质量发展行动任务紧密衔接；应与区域产业发展实际需要紧密结合；应符合制造业中试平台建设指引和重点方向布局要求。（二）基础能力：1.应具备完善的中试线或试验场地，配备必需的安全、环保等配套设施；制定设备要素表，现有试验设备、测量仪器、关键软件等中试设备核心指标达到区域先进水平，中试设备或设施原值不低于1000万元；中试环境、工艺流程和软硬件等应符合标准。2.应拥有本领域研发能力强、技术水平高、工程化实践经验丰富的工程技术带头人，拥有与核心服务能力相适应的管理、研发、试验、质量、安全等专业人才队伍。其中专职技术或管理人员不少于5人。3.应具备良好的质量、安全、信用和社会责任情况。近三年未发生违法违规行为，未发生较大及以上安全事故和重大质量、环境污染、失泄密等事故，未出现数据资料弄虚作假、严重失信等情形。（四）服务成效：应具有公共服务性质和功能，实现资源对外开放共享，对本领域科技成果产业化应用作出一定贡献。至少完成1项国家级或省部级重大自主创新成果的中试验证或成功完成1项新产品产业化，服务企业数量不低于5家。上年度（或申报当年度）中试服务收入应不低于1000万元或不低于依托单位主营业务收入总额的5%。",type:"资质",ben:"把工程化验证能力建成行业公共服务平台，既拿培育支持，也扩大产业链话语权",inds:["制造业","医疗","机器人"],district:null,key:"::制造业中试平台"},{name:"制造业单项冠军企业",dept:"工信部",cat:"资质",auth:"工业和信息化部",time:"9—11月",cond:"（一）专业发展指标：1.长期专注并深耕于制造业产业链某一环节或某一产品领域。截至上年末，从事相关领域时间达到10年及以上，属于新产品的应达到5年及以上。2.企业发展稳中向好，近3年平均主营业务收入须达到4亿元及以上。（二）市场竞争指标：1.申请产品（生产性服务）市场占有率位居全球前3位。2.申请产品质量精良，生产技术或制造工艺国际先进，关键性能指标处于国际同类产品领先水平，主导产品能耗达到行业能耗限额标准先进值。3.重视并实施国际化经营和品牌战略，国际业务收入行业领先，全球资源配置能力强。（三）自主创新指标：1.重视技术和产品创新，拥有高水平研发机构，研发投入强度达到行业领先水平。2.拥有核心自主知识产权，国际、国内专利数量行业领先，主导或参与制定国际、国家和行业标准。3.科技成果转化成效明显，相关知识产权已实际应用并产生经济效益。（四）经营管理指标：1.经营业绩优秀，主营业务收入或利润行业领先。2.管理体系系统完善，积极开展管理创新。战略管理、运营管理、风险管理水平高，企业质量管理能力强。",type:"资质",ben:"制造业细分领域最高等级认定，是企业细分市场领导地位的国家级背书",inds:["制造业","医疗","机器人"],district:null,key:"::制造业单项冠军企业"},{name:"北京市专精特新中小企业认定",dept:"市经信局",cat:"资质",auth:"北京市经信局",time:"5—7月",cond:"【原文出处】工信部企业〔2026〕2号附件1《专精特新中小企业认定标准》（须同时满足）：（一）已获科技和创新型中小企业称号；（二）上年度营业收入不低于1500万元（或近两年新增股权融资实缴不低于2000万元）；主营业务收入占营业收入比重不低于80%；资产负债率不高于80%；（三）近两年研发费用每年不低于100万元，且占营业收入比重不低于3%；（四）拥有I类知识产权不少于1项；（五）评价得分不低于50分。",type:"资质",ben:"国家专精特新梯队培育的入门资质，是申报国家专精特新“小巨人”企业的前置条件",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::北京市专精特新中小企业认定"},{name:"北京市企业技术中心",dept:"市经信局",cat:"资质",auth:"北京市经信局",time:"常态化申报",cond:"现已发布新政策，根据领域匹配对应标准：（一）企业在本市依法注册，信用状况良好，具有行业领先的技术创新能力和水平。（二）企业技术中心必须在企业组织结构中独立设置，企业高层高度重视企业技术创新工作并担任技术中心主任，企业具有较好的技术创新机制，企业技术中心组织体系健全且建立运行两年以上（截止上一年度末），创新效率和效益显著。企业技术中心应建立技术委员会和专家委员会。（三）企业在行业中具有显著的发展优势和竞争优势，企业上一年度主营业务收入不低于2亿元（其中建筑业企业不低于15亿元，非建筑业的专精特新企业以及我市重点发展的前沿产业领域企业不低于1亿元）。（四）有较高的研发投入，需满足以下条件之一：1.企业上一年度研究与试验发展经费支出在1000-5000万元之间，且占上一年度主营业务收入的比例不低于：制造业3%；信息传输、软件和信息技术服务业7%；科学研究和技术服务业5%；建筑业1%；其他3%。2.企业上一年度研究与试验发展经费支出不低于5000万元。3.主营业务收入小于2亿元的专精特新企业以及我市重点发展的前沿产业领域企业，上一年度研究与试验发展经费支出不低于1000万元，且占上一年度主营业务收入的比例不低于：制造业10%，信息传输、软件和信息技术服务业20%，科学研究和技术服务业10%，其他10%。（五）拥有技术水平高、实践经验丰富的技术带头人，专职研究与试验发展人员数不低于60人（信息传输、软件和信息技术服务业,科学研究和技术服务业不低于80人）。（六）有较好的技术积累，重视前沿技术开发，具有开展高水平技术创新活动的能力。（七）企业重视知识产权工作，近三年内获得的有效知识产权不少于10件（包括专利、软件著作权、集成电路布图设计专有权、植物新品种等,医药制造业企业获得的临床试验许可、药品注册证书可视同有效知识产权）；制造业企业近三年申请的发明专利不少于三件（医药制造业企业的临床试验申请、药品注册申请可视同发明专利申请）。（八）研究与试验发展经费支出和研究与试验发展人员数原则上以统计局报表为准，未纳统企业可提供已上传注册会计师行业统一监管平台并赋码的专项审计报告。集成电路、涉军涉密等企业可提供相应佐证材料。",type:"资质",ben:"研发体系资质背书，支撑小巨人评价得分与后续国家级企业技术中心申报",inds:["制造业","医疗","机器人"],district:null,key:"::北京市企业技术中心"},{name:"北京市信创“首贯标”奖励及适配平台支持",dept:"市经信局",cat:"资金（最高1000万元）",auth:"北京市经济和信息化局",time:"按当年通知为准",cond:"《北京市关于加快打造信息技术应用创新产业高地的若干政策措施》（京经信发〔2023〕16号，现行有效）：第四条“首贯标”奖励——对首轮贯标的用户企业给予奖励，单个企业最高不超过50万元，单项标准奖励总金额最高不超过500万元；第五条——对重点行业开放应用场景、推广信创标准的重大建设项目给予资金支持最高不超过1000万元，行业共性适配平台最高不超过500万元。本文件第三条“首方案”奖励已在本模板“首方案”条目单列，此处不重复。",type:"资金",ben:"首贯标用户企业最高50万元，信创重大建设项目最高1000万元，行业共性适配平台最高500万元",inds:["软件业"],district:null,key:"::北京市信创“首贯标”奖励及适配平台支持"},{name:"北京市创新医疗器械特别审查/优先审批程序",dept:"市药监局",cat:"资质",auth:"北京市药品监督管理局",time:"常态化申报",cond:"《北京市医疗器械快速审评审批办法》（京药监发〔2025〕114号，2025年8月1日施行）：适用于在京申请的第二类医疗器械，北京市首创、性能或安全性有根本性改进、国内领先、临床应用价值明显的产品可申请创新医疗器械特别审查，纳入后优先检验（单独排序）、技术审评平均20个工作日、行政审批2个工作日；另设医疗器械优先审批审查程序（临床急需等情形）。",type:"资质",ben:"北京市第二类器械快速审评通道，优先检验、技术审评约20个工作日，加快在京取证",inds:["医疗"],district:null,key:"::北京市创新医疗器械特别审查/优先审批程序"},{name:"北京市国际科技创新中心知识产权能力提升计划",dept:"知识产权局",cat:"资金（最高500万元）",auth:"北京市知识产权局",time:"5—7月",cond:"一、申报对象1.申报国际能力提升项目的申请人（以下简称“申请人”）应在我市行政区域内依法登记注册，从事科技创新活动的企业、高等学校、科研机构、医疗卫生机构和社会组织等创新主体，且单位信用状态良好，未被纳入失信被执行人名单。2.专利类项目申请人应为第一专利权人；通过专利合作条约（PCT）、巴黎公约等途径申请的不区分权利人顺序的国外专利，应以专利申请时的第一申请人作为申请人；专利权人发生过变更的，应以变更后的第一专利权人作为申请人。3.地理标志类项目申请人应为被纳入中外互认清单的地理标志的专用权人。4.知识产权使用费出口类项目申请人的知识产权使用费出口金额应在中国人民银行北京营业管理部的年度进出口统计范围之内。二、申报范围（一）支持创新主体夯实知识产权基础（《办法》第六条）1.授权公告日（注册登记日）在2025年1月1日至2025年6月30日之间的国内授权发明专利和我国香港、澳门、台湾地区发明（标准）专利（未获得过其他渠道财政资金支持），且相关专利处于有效维持状态。2.所指的专精特新中小企业，需已被北京市经济和信息化局“专精特新”中小企业公示名单收录。3.所指的上述相关专利涉及产品应已完成备案或已被认定为专利密集型产品。（二）支持或培育国际知识产权能力强基单位、重点单位、标杆单位（《办法》第七条至第九条）1.授权公告日在2025年1月1日至2025年6月30日之间的国外授权发明专利（未获得过其他渠道财政资金支持），且相关专利处于有效维持状态。2.所指的国际知识产权能力强基单位、重点单位、标杆单位，需已满足《办法》第七条至第九条的知识产权管理制度、管理部门、管理人员等要求。（三）支持中外地理标志布局（《办法》第十条）在2025年1月1日至2025年12月31日期间被纳入中外互认清单的地理标志（未获得过其他渠道财政资金支持）的专用权人。（四）支持知识产权服务出口（《办法》第十一条）在2025年1月1日至2025年12月31日期间发生的知识产权使用费年度出口额（未获得过其他渠道财政资金支持）符合《办法》要求的申请人。",type:"资金",ben:"发明专利、国际布局等方向均有补助：专精特新认定后补助最高5万元、国际专利布局最高500万元（较大数量认定最高2000万元）；与专利产品备案联动推进",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::北京市国际科技创新中心知识产权能力提升计划"},{name:"北京市技术转移机构登记",dept:"市科委/中关村管委会",cat:"资质",auth:"北京市科学技术委员会、中关村科技园区管理委员会",time:"常态化申报",cond:"《北京市技术转移机构及技术经理人登记办法》（京科转发〔2026〕47号，京科发〔2022〕13号同时废止）：北京技术转移机构及技术经理人实行登记制，符合条件的技术转移机构自愿进行登记，审核通过后进入技术转移机构库、实施动态管理；条件为在北京市行政区域内从事科技成果转移转化和产业化工作，有固定的经营场所，有专职从事科技成果转移转化和产业化的人员，有从事技术转移服务的规章制度和服务规范；登录北京市技术转移机构管理系统随时填报。",type:"资质",ben:"登记进入北京市技术转移机构库，为概念验证平台等项目申报的衔接资格",inds:["科技服务业"],district:null,key:"::北京市技术转移机构登记"},{name:"北京市推动软件和信息服务业高质量发展的若干政策措施（首试首用等）",dept:"市经信局",cat:"资金（按当年政策）",auth:"北京市经信局",time:"按当年通知为准",cond:"【出处】《北京市推动软件和信息服务业高质量发展的若干政策措施》（京经信发〔2022〕162号）。该文件官方正文为图片版发布，本格据首都之窗官方政策解读表述，非逐字原文：支持软件产品首试首用，支持属于关键领域“补短板”、填补国内（国际）空白、技术水平国内（国际）首创的软件产品实现首次应用；鼓励本市国有企业、事业单位在同等条件下，优先采用纳入国家和本市重点目录的软件产品，为基础软件、工业软件等领域关键核心技术提供早期应用场景和试用环境，促进关键核心技术突破、成果转化和产业化落地。同文件其他方向（解读口径）：支持新技术新产品研发，围绕基础软件、工业软件等重点领域开展科技攻关，实施“产业筑基工程”，通过“揭榜挂帅”等方式支持一批关键软件产品研发，单个项目补助最高3000万元；鼓励金融机构提供固定资产贷款、研发贷等中长期贷款产品，对符合条件的给予不超过2%的贴息支持，每家企业年度最高支持1000万元。",type:"资金",ben:"关键领域补短板、国内首创的软件产品可借首试首用获得早期应用场景（额度以当年指南为准）",inds:["软件业"],district:null,key:"::北京市推动软件和信息服务业高质量发展的若干政策措施（首试首用等）"},{name:"北京市支持科技服务业高质量发展若干措施",dept:"市科委/中关村管委会",cat:"资金（按当年政策）",auth:"北京市科委、中关村管委会",time:"按当年通知为准",cond:"《北京市支持科技服务业高质量发展若干措施》（京科发〔2025〕3号，北京市科学技术委员会、中关村科技园区管理委员会等部门2025年1月印发）原文：（七）鼓励检验检测认证服务与新兴产业融合发展。聚焦高精尖产业和未来产业发展需求，引导检验检测企业开展检测技术攻关，建设一批安全性检测、适配验证、质量检测、极端条件可靠性测试、认证公共服务等高能级检测服务平台，提升检验检测专业化水平。鼓励企业整合检验检测、认证、培训等服务资源，加快区块链智能合约等技术应用，发展在线检测、自动化检测、平台分包和物联网智能检测等新模式，提供线上线下结合的一站式综合服务。支持检验检测平台申报纳入首都科技条件平台，面向企业提供专业开放共享服务。",type:"资金",ben:"市级科技服务业总入口政策，平台建设、融合发展等方向可获支持（额度以当年指南为准）",inds:["科技服务业"],district:null,key:"::北京市支持科技服务业高质量发展若干措施"},{name:"北京市新技术新产品首次进入市场支持",dept:"市科委/中关村管委会",cat:"资金（首个合同金额30%后补助、最高500万元）",auth:"北京市科委、中关村管委会",time:"9—11月",cond:"【原文出处】《中关村国家自主创新示范区提升企业创新能力支持资金管理办法》第九条（支持企业新技术新产品首次进入市场）：（一）项目申报时属于有效期内的北京市新技术新产品；（二）属于国际或国内首次研制，在同类技术产品中达到国际或国内领先水平，对本领域的技术进步有推动作用，未来可以产生显著的经济社会效益；（三）知识产权明晰，申报单位拥有该新技术新产品关键核心技术的自主知识产权；（四）申报单位可选择技术产品前3个合同中任意1个进行项目申报，合同须为近一年内签订的合同（以合同签订日期为准）。",type:"资金",ben:"按首个合同金额30%后补助、最高500万元，帮助新产品打开市场",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::北京市新技术新产品首次进入市场支持"},{name:"北京市新技术新产品（服务）认定",dept:"市科委/中关村管委会",cat:"资质",auth:"北京市科委、中关村管委会",time:"2—4月（第一批）",cond:"（一）申请单位应为本市行政区域内登记注册的科技企业、高等学校、科研机构、医疗机构、科技型社会组织等创新主体，无在惩戒执行期内的科研严重失信行为记录和相关社会领域严重失信记录。（二）申请技术产品服务应符合国家法律法规和科技伦理规范的相关要求，符合本市产业技术发展导向，技术先进、产权明晰、质量可靠、市场前景广阔。（三）申请技术产品服务应符合以下条件之一：1. 能够通过基础研究和原始创新，产生原创性、颠覆性科技成果；2. 能够带动新兴产业迈向高端，引导抢占未来产业；3. 能够填补国内空白，支撑重要产业链供应链自主安全可控；4. 能够改造提升传统产业，推动产业高端化、智能化、绿色化。",type:"资质",ben:"进入政府采购与市场推广目录的前置资质，是北京市新技术新产品首次进入市场支持的申报前提",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::北京市新技术新产品（服务）认定"},{name:"北京市知识产权试点单位/专利产品备案",dept:"知识产权局",cat:"资质",auth:"北京市知识产权局",time:"4—6月（试点）、常态化申报（备案）",cond:"【依据】北京市知识产权试点、优势单位梯队培育（京知局〔2024〕130号），优势单位条件：（一）已认定为知识产权试点单位，或已具备知识产权试点单位认定条件；（二）具有知识产权工作管理部门，且专职人员在3人（含）以上；（三）持续加强知识产权工作，近三年知识产权工作经费投入整体持续增长，满足知识产权战略和规划实施的需要；（四）近三年专利申请量整体持续增长，其中申请发明专利占比不低于30%；（五）申报单位为企业的，近三年专利实施率平均不低于60%，知识产权产品及服务收入占主营业务收入的平均比例不低于60%。专利产品备案条件【原文出处】《关于开展专利产品备案工作的通知》（国知办函运字〔2022〕985号）及北京市备案工作要求：（一）备案主体具备独立法人资格，并应是制造、销售专利产品的专利权人或被许可人。（二）备案专利产品应至少涉及一项有效专利，且该一项或多项专利不存在权属纠纷，并已取得较好市场经济效益。（三）同一型号或品种的产品应作为一件产品进行备案，相同产品不得重复备案。",type:"资质",ben:"先完成试点单位认定与核心产品专利备案，为后续优势单位与专利密集型产品认定铺路",inds:["软件业","科技服务业"],district:null,key:"::北京市知识产权试点单位/专利产品备案"},{name:"北京市知识产权试点单位/优势单位",dept:"知识产权局",cat:"资质",auth:"北京市知识产权局",time:"4—6月（试点）、次年4—6月（优势）",cond:"【依据】北京市知识产权试点、优势单位梯队培育（京知局〔2024〕130号），优势单位条件：（一）已认定为知识产权试点单位，或已具备知识产权试点单位认定条件；（二）具有知识产权工作管理部门，且专职人员在3人（含）以上；（三）持续加强知识产权工作，近三年知识产权工作经费投入整体持续增长，满足知识产权战略和规划实施的需要；（四）近三年专利申请量整体持续增长，其中申请发明专利占比不低于30%；（五）申报单位为企业的，近三年专利实施率平均不低于60%，知识产权产品及服务收入占主营业务收入的平均比例不低于60%。",type:"资质",ben:"知识产权梯队资质，优势单位是后续专利奖、能力提升项目的基础",inds:["制造业","医疗","机器人"],district:null,key:"::北京市知识产权试点单位/优势单位"},{name:"北京市科学技术奖",dept:"市科委/中关村管委会",cat:"荣誉+资金（最高100万元）",auth:"北京市科委、中关村管委会",time:"5—6月",cond:"（一）成果属技术发明、科技进步等奖种范围，技术创新突出并已应用产生效益；（二）按提名制申报，须有提名单位/专家提名；（三）完成单位、完成人排序及成果权属无争议。",type:"荣誉",ben:"市级科技荣誉与奖金并行（特等奖100万元、一等奖50万元、二等奖30万元），提名制申报，注重成果应用效益",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::北京市科学技术奖"},{name:"北京市科技型企业孵化器认定",dept:"市科委/中关村管委会",cat:"资质",auth:"北京市科学技术委员会、中关村科技园区管理委员会",time:"按当年通知为准",cond:"《北京市科技型企业孵化器管理办法》（京科发〔2025〕26号，2026年1月29日实施，京科发〔2020〕13号同时废止）第八条：独立法人、实际注册并运营满1年；孵化服务领域聚焦本市高精尖产业；上年度专业服务收入占总收入比例不低于30%，或近2年专业服务收入平均增速不低于5%；在孵企业不少于30家，其中上年度新增注册企业数占比不低于20%，科技型中小企业占比不低于40%。认定原则上每年组织一次。",type:"资质",ben:"市级科技型企业孵化器认定，享受科技企业孵化器相关税收优惠，资格有效期3年",inds:["科技服务业"],district:null,key:"::北京市科技型企业孵化器认定"},{name:"北京市首台（套）重大技术装备产品",dept:"发改委",cat:"资质+资金（最高200万元）",auth:"北京市发展和改革委员会",time:"常态化申报（季度评审）",cond:"一、征集领域首台（套）是指国内实现重大技术突破、拥有知识产权、尚未在京取得市场业绩的装备产品，包括前三台（套）或批（次）成套设备、整机设备及核心部件、控制系统、基础材料、软件系统等。本次重点面向医药健康、集成电路、交通、机器人及智能制造、特色智能专用装备、高端能源及节能环保装备、航空航天、前沿领域关键设备8个领域征集首台（套）产品。二、基本条件（一）申报单位基本条件：申报单位在本市行政区域内依法注册并具有独立法人资格的企事业单位。（二）产品基本条件：1.技术水平处于国际先进、国内领先或国内先进，在技术、产品、装备、工艺等环节实现重大突破，且处于产业链关键环节，对产业发展具有较强的带动作用。2.在我国依法拥有清晰的自主知识产权的所有权。3.符合国家和本市对产品生产、销售的相关规定。4.产品在京未销售或销售数量不超过3台（套）或批次。三、申报要求1.申报材料：北京市首台（套）重大技术装备评定申报书；属于国家特殊行业管理要求的产品，提供相关主管部门批准颁发的产品生产许可、产品审批、上市销售许可等证明材料；属于国家实施强制性产品认证的产品，提供强制性产品认证证书。2.工作要求：首台（套）产品征集评定工作采取“随时申报，季度评定”的方式组织开展，申报产品可随时通过各区发展改革部门向市首台（套）联席会办公室申报，市首台（套）联席会办公室按季度组织开展评审，评审未通过产品，当年不得再次申报（申报材料不齐全的除外）。",type:"资质",ben:"首台（套）认定是保险费补贴、应用推广与多项资金支持的前置资质（配套保险费补贴最高200万元）",inds:["制造业","医疗","机器人"],district:null,key:"::北京市首台（套）重大技术装备产品"},{name:"北京市高价值专利扶持资金",dept:"知识产权局",cat:"资金（最高18万元）",auth:"北京市知识产权局",time:"按当年通知为准",cond:"【依据】《北京市高价值专利扶持资金实施办法》（北京市知识产权局依据《北京市知识产权扶持资金管理办法》制定，2026年11月印发施行）；以下专项一条件按市知识产权局官方简明问答口径。一、扶持对象：本市从事生产经营活动的企事业单位和开展业务活动的社会组织；申报专项一的，应为国家及北京市相关部门认定的、资质在有效期内的专精特新中小企业（含小巨人）。申报单位信用状态应良好，未被纳入失信被执行人名单。二、高价值专利：指经国家知识产权局授权的战略性新兴产业的有效专利或在海外有同族专利权的有效专利。专利产品备案是专项一申报的必要条件、专项二的优先支持条件。三、专项一扶持内容：支持专精特新中小企业聚焦战略性新兴产业、未来产业领域开展高价值发明专利布局工作。四、专项一扶持条件：（一）申报单位为专精特新中小企业；（二）申报单位已设立知识产权管理制度，设有知识产权管理部门和管理人员；（三）申报项目中涉及的国内发明专利为申报期获得授权的高价值专利，并已完成专利产品备案；（四）申报项目中涉及的发明专利为多个专利权人共有的，由第一顺序专利权人申报。五、扶持标准：综合评估申报单位国内知识产权创造、管理和运用水平，结合申报期创新指数得分情况，采取后补贴方式分梯级给予一次性资金扶持，最高额度不超过18万元。（本办法另设专项二高价值专利组合布局，每项最高35万元；专项三海外高价值专利布局，最高600万元。）",type:"资金",ben:"专精特新中小企业新授权的高价值发明专利可获后补贴，分梯级最高18万元",inds:["软件业"],district:null,key:"::北京市高价值专利扶持资金"},{name:"北京市高精尖产业发展项目资金“首方案”奖励",dept:"市经信局",cat:"资金（已回款金额15%，最高3000万元）",auth:"北京市经信局",time:"2—4月",cond:"【原文出处】《北京市经济和信息化局 北京市财政局关于印发2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）的通知》（2026年2月14日发布，公开文本未标注文号）：方向6 打造行业标杆示范首方案奖励。重点对于首次解决重点行业典型应用场景需求，已实际落地且系统运行良好的优质信创解决方案，按采购合同中非硬件部分的信创产品及服务已回款金额的15%给予牵头单位奖励，最高不超过3000万元。（详见附件6）指南通用申请条件：1.申报单位应在本市登记注册且近3年无因违法失信行为被行政机关实施联合惩戒或被司法部门采取失信惩戒措施。2.申报项目中已通过其他市级财政资金支持的实施内容，高精尖项目资金、中小资金原则上不再予以重复支持。同一单位原则上只能获得2026年内高精尖项目资金单个方向支持。",type:"资金",ben:"首次解决重点行业典型应用场景需求、已落地运行良好的信创解决方案，按非硬件已回款金额15%奖励、最高3000万元",inds:["软件业"],district:null,key:"::北京市高精尖产业发展项目资金“首方案”奖励"},{name:"北京市高精尖老旧厂房改造投资项目",dept:"市经信局",cat:"资金（总投资10%，最高1000万元）",auth:"北京市经信局",time:"按当年通知为准",cond:"一、申报条件（参考）1.项目申报单位应为在京企业，生产经营内容应符合国家相关法律法规、政策要求。2.申报项目应符合国家相关法律法规、政策，以及本市产业政策要求，手续齐全，未获得其他市级财政资金支持；3.申报项目在2024年1月1日至12月31日内已竣工且遵守北京市老旧厂房更新项目管理要求，建设期不超过3年，固定资产投资不低于500万元，开展老旧厂房更新利用，并实施先进制造业、软件信息服务业等产业类项目建设。4.申报项目应具备有效老旧厂房盘活效果，技术改造类项目不在支持范围内。二、支持方式和标准按不超过纳入奖励范围总投资的10％给予奖励，单个项目奖励金额最高不超过1000万元。",type:"资金",ben:"老旧厂房更新改造可按总投资10%获得奖励、最高1000万元",inds:["制造业"],district:null,key:"::北京市高精尖老旧厂房改造投资项目"},{name:"北京高精尖产业设计中心",dept:"市经信局",cat:"资质",auth:"北京市经济和信息化局",time:"按当年通知为准",cond:"《北京高精尖产业设计中心认定管理办法》（京经信发〔2023〕100号）：企业工业设计中心须专门成立、独立运行，稳定运营3年以上；设计团队人员40人以上，其中本科及以上学历或取得工业设计/高级专业技术职称（职业资格）人员比例不低于60%；近三年 平的工厂。第十五条 近三年有下列情况的企业或园区（含园区内企业），不得申请、推荐和列入绿色制造名单：（一）未正常经营生产的（工商注销、连续停产12个月以上、被市场监督管理部门列入经营异常名单且未被移出等）；（二）发生安全（含网络安全、数据安全）、质量、环境污染等事故以及偷漏税等违法违规行为的（参照“信用中国”和“国家企业信用信息公示系统”）；（三）被动态调整出绿色制造名单的；（四）在国务院及有关部委相关督查工作中被发现存在严重问题的；（五）被列入工业节能监察整改名单且未按要求完成整改的；（六）企业被列为失信被执行人。",type:"资质",ben:"绿色制造体系资质，与智能工厂形成“智能+绿色”双线布局",inds:["制造业","医疗","机器人"],district:null,key:"::绿色工厂"},{name:"绿色能源新技术新产品应用推广奖励",dept:"市经信局",cat:"资金（最高500万元）",auth:"北京市经济和信息化局",time:"3—4月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向5：重点支持绿色能源制造业企业的产品应用推广，对符合《北京市绿色能源新技术新产品目录（2026）版》的产品，单个产品按上年度合同实际履约额不超过20%给予奖励，最高不超过300万元，单个企业年度奖励金额最高不超过500万元；须经所在区经信主管部门推荐。指南通用条件：申报单位在本市登记注册、近3年无因违法失信行为被联合惩戒记录。",type:"资金",ben:"绿色能源新产品按上年度合同履约额最高20%奖励，单产品最高300万元、企业年度最高500万元",inds:["制造业"],district:null,key:"::绿色能源新技术新产品应用推广奖励"},{name:"超长期特别国债",dept:"发改委",cat:"资金（固定资产投资额的10%—30%）",auth:"国家发展和改革委员会",time:"1—2月",cond:"需以实际政策文件为准：重点支持制造业、能源、物流、民生保障、基础设施等领域，严格限制房地产、酒店等商业性项目，具体范围以《2026年超长期特别国债支持方向指南》为准。自筹资金比例：原则上自筹资金不低于总投资的60%，申报时需提供银行到账证明；贫困地区或特殊项目可放宽至50%。",type:"资金",ben:"按固定资产投资额10%—30%支持，力度大，可覆盖设备购置与更新改造投入",inds:["制造业","医疗","机器人"],district:null,key:"::超长期特别国债"},{name:"软件产品增值税即征即退",dept:"财政部/国家税务总局",cat:"资金（实际税负超3%部分即征即退）",auth:"财政部、国家税务总局",time:"常态化申报",cond:"【原文出处】《财政部 国家税务总局关于软件产品增值税政策的通知》（财税〔2011〕100号）：一、（一）增值税一般纳税人销售其自行开发生产的软件产品，按17%税率征收增值税后，对其增值税实际税负超过3%的部分实行即征即退政策。（二）增值税一般纳税人将进口软件产品进行本地化改造后对外销售，其销售的软件产品可享受本条第一款规定的增值税即征即退政策。本地化改造是指对进口软件产品进行重新设计、改进、转换等，单纯对进口软件产品进行汉字化处理不包括在内。三、满足下列条件的软件产品，经主管税务机关审核批准，可以享受本通知规定的增值税政策：1．取得省级软件产业主管部门认可的软件检测机构出具的检测证明材料；2．取得软件产业主管部门颁发的《软件产品登记证书》或著作权行政管理部门颁发的《计算机软件著作权登记证书》。四、即征即退税额=当期软件产品增值税应纳税额-当期软件产品销售额×3%。【延续实施】《财政部 税务总局关于增值税法施行后增值税优惠政策衔接事项的公告》（财政部 税务总局公告2026年第10号）第五条第（四）项明确：自2026年1月1日起，财税〔2011〕100号现行有效的增值税优惠政策继续实施。注：100号原文“17%税率”为文件发布时税率，现行增值税税率为13%，计算口径不变。",type:"资金",ben:"软件产品增值税实际税负超过3%的部分即征即退，直接降低软件产品税负",inds:["软件业"],district:null,key:"::软件产品增值税即征即退"},{name:"软件企业所得税“两免三减半”",dept:"财政部/国家税务总局",cat:"资金（前2年免征、第3—5年减半）",auth:"财政部、国家税务总局",time:"常态化申报",cond:"【原文出处】《财政部 税务总局 发展改革委 工业和信息化部关于促进集成电路产业和软件产业高质量发展企业所得税政策的公告》（财政部 税务总局 发展改革委 工业和信息化部公告2020年第45号）：三、国家鼓励的集成电路设计、装备、材料、封装、测试企业和软件企业，自获利年度起，第一年至第二年免征企业所得税，第三年至第五年按照25%的法定税率减半征收企业所得税。国家鼓励的集成电路设计、装备、材料、封装、测试企业和软件企业条件，由工业和信息化部会同国家发展改革委、财政部、税务总局等相关部门制定。【原文出处】《国家鼓励的软件企业条件》（工业和信息化部 国家发展改革委 财政部 国家税务总局公告2021年第10号）：一、国家鼓励的软件企业是指同时符合下列条件的企业：（一）在中国境内（不包括港、澳、台地区）依法设立，以软件产品开发及相关信息技术服务为主营业务并具有独立法人资格的企业；该企业的设立具有合理商业目的，且不以减少、免除或推迟缴纳税款为主要目的；（二）汇算清缴年度具有劳动合同关系或劳务派遣、聘用关系，其中具有本科及以上学历的月平均职工人数占企业月平均职工总人数的比例不低于40%，研究开发人员月平均数占企业月平均职工总数的比例不低于25%；（三）拥有核心关键技术，并以此为基础开展经营活动，汇算清缴年度研究开发费用总额占企业销售（营业）收入总额的比例不低于7%，企业在中国境内发生的研究开发费用金额占研究开发费用总额的比例不低于60%；（四）汇算清缴年度软件产品开发销售及相关信息技术服务（营业）收入占企业收入总额的比例不低于55%［嵌入式软件产品开发销售（营业）收入占企业收入总额的比例不低于45%］，其中软件产品自主开发销售及相关信息技术服务（营业）收入占企业收入总额的比例不低于45%［嵌入式软件产品开发销售（营业）收入占企业收入总额的比例不低于40%］；（五）主营业务或主要产品具有专利或计算机软件著作权等属于本企业的知识产权；（六）具有与软件开发相适应的生产经营场所、软硬件设施等开发环境（如合法的开发工具等），建立符合软件工程要求的质量管理体系并持续有效运行；（七）汇算清缴年度未发生重大安全事故、重大质量事故、知识产权侵权等行为，企业合法经营。",type:"资金",ben:"自获利年度起前2年免征、后3年减半征收企业所得税，是软件企业力度最大的所得税优惠之一",inds:["软件业"],district:null,key:"::软件企业所得税“两免三减半”"},{name:"软件智能化提升奖励",dept:"市经信局",cat:"资金（最高3000万元）",auth:"北京市经济和信息化局",time:"3—6月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向13：重点支持信息软件企业通过算力构建、大模型部署、数据治理等方式提升软件研发效率，并对基础软件、工业软件、新型安全软件、游戏软件等进行智能化技改；根据智能软件产品所达到智能化成熟度等级，按不超过项目总投资额的10%、15%、20%给予分档奖励，单个项目奖励金额不超过3000万元。",type:"资金",ben:"软件智能化技改按智能化成熟度等级分档奖励（项目总投资10%/15%/20%），单项目最高3000万元",inds:["软件业"],district:null,key:"::软件智能化提升奖励"},{name:"重污染天气环保绩效提升项目奖励",dept:"市经信局",cat:"资金（最高3000万元）",auth:"北京市经济和信息化局",time:"3—4月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向16：重点支持企业实施重污染天气环保绩效提升项目，对满足相关要求的项目，按照不超过核定总投资的30%给予奖励；单个项目奖励金额低于10万元的，按照10万元给予奖励；单个项目奖励金额不超过3000万元；须先通过“高精尖产业项目库”填报，并经所在区经信主管部门推荐。",type:"资金",ben:"环保绩效提升项目按核定总投资最高30%奖励，单项目最高3000万元",inds:["制造业"],district:null,key:"::重污染天气环保绩效提升项目奖励"},{name:"重点应用场景项目",dept:"市科委/中关村管委会",cat:"资金（项目预算30%支持、最高1000万元）",auth:"北京市科委、中关村管委会",time:"10—11月",cond:"（一）相关技术产品应具备明晰的知识产权；（二）项目实施后，可带动相关技术产品迭代创新和示范应用，可形成具有推广价值的标杆性应用场景及解决方案，促进中小企业进入产业链、供应链，实现大中小企业融通发展；（三）项目实施地在本市范围内。",type:"资金",ben:"按项目预算30%支持、最高1000万元，以场景开放带动产品迭代与融通发展",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::重点应用场景项目"},{name:"重点新材料首批次应用示范奖励",dept:"市经信局",cat:"资金（最高1000万元）",auth:"北京市经济和信息化局",time:"3—4月",cond:"《2026年北京市高精尖产业发展项目资金和支持中小企业发展资金实施指南（第一批）》方向8：重点支持新材料制造业企业的产品首批次示范应用，对符合《北京市重点新材料首批次应用示范指导目录（2026年版）》的新材料产品，按照销售额分档给予奖励，单个产品奖励金额不超过500万元，同一企业年度奖励金额不超过1000万元；须经所在区经信主管部门推荐。",type:"资金",ben:"新材料产品首批次示范应用按销售额分档奖励，单产品最高500万元、企业年度最高1000万元",inds:["制造业"],district:null,key:"::重点新材料首批次应用示范奖励"},{name:"首台（套）重大技术装备保险费补贴",dept:"市经信局",cat:"资金（保费80%，每年最高200万元）",auth:"北京市经信局",time:"7—9月",cond:"（一）投保的首台（套）装备应为有效期内的北京市首台（套）重大技术装备；（二）承保的险种以保障产品创新性风险、产品使用风险以及质量保障为核心。",type:"资金",ben:"按保费80%补贴、每年最高200万元，降低首台（套）产品市场推广风险",inds:["制造业","医疗","机器人"],district:null,key:"::首台（套）重大技术装备保险费补贴"},{name:"首批次新材料保险补偿",dept:"工信部",cat:"资金（保费最高80%补助）",auth:"工业和信息化部",time:"9月",cond:"《关于进一步完善首台（套）重大技术装备首批次新材料保险补偿政策的意见》（工信部联重装〔2024〕89号）及实施细则（工信厅联重装〔2024〕64号）：生产制造《重点新材料首批次应用示范指导目录（2024年版）》所列产品的企业通过资格审定后，投保首批次新材料综合保险，对符合条件的投保企业按照不超过实际缴纳保费80%给予补助，按产品价值的一定比例核定保费补助资金额度，资格有效期不超过3年；年度组织（2025年通知于9月发布）。",type:"资金",ben:"投保首批次新材料综合保险，按实际缴纳保费最高80%补助",inds:["制造业"],district:null,key:"::首批次新材料保险补偿"},{name:"首版次软件产品（国家级遴选）",dept:"工信部",cat:"资质",auth:"工业和信息化部",time:"按当年通知为准",cond:"【原文出处】《工业和信息化部办公厅关于开展2026年首版次软件申报工作的通知》（工信厅信发函〔2026〕496号）：一、申报方向：首版次软件指在关系国家安全、国民经济命脉和国计民生等重点领域取得重大技术突破、拥有自主知识产权，但处于市场初期阶段或者尚未形成竞争优势的创新软件产品。既包括首次发布的软件产品，也包括升级迭代新版本的软件产品。本年度选择工业软件作为申报方向。二、申报条件：1.申报单位注册地且主要创新工作开展地位于中华人民共和国境内。2.申报单位拥有申报软件产品的核心技术和知识产权，具备相应的研发能力。3.申报软件产品取得技术创新突破，在质量水平、市场能力等方面具有一定优势，在市场正常销售，且三年内无停售计划。申报要求：请各推荐单位于2026年11月23日前报送审核材料至工业和信息化部，逾期将不再受理（企业向省级主管部门提交的时限以属地转发通知为准）。",type:"资质",ben:"国家级遴选认定，为创新软件产品提供权威背书与市场推广支持",inds:["软件业"],district:null,key:"::首版次软件产品（国家级遴选）"},{name:"首都标准化战略补助资金（标准转化）",dept:"市场监管总局",cat:"资金（最高20万元）",auth:"北京市市场监督管理局",time:"3—5月",cond:"《实施首都标准化战略补助资金管理办法》（京市监发〔2024〕52号）标准转化补助原文：第二十六条 补助资金支持的标准转化项目是指由市市场监管局向国家市场监督管理总局报送的，将本市地方标准或北京社会团体发布的团体标准转化为国际标准、国家标准立项的项目。第二十七条 标准转化项目补助范围和额度如下：（一）推动本市地方标准或北京社会团体发布的团体标准转化为国际标准立项的，择优给予补助资金20万元；（二）推动本市地方标准或北京社会团体发布的团体标准转化为国家标准立项的，择优给予补助资金10万元。第二十八条 标准转化项目补助资金申报应由国际标准组织国内技术对口单位或承担全国专业标准化技术委员会秘书处工作的单位申报。同一单位年度标准转化项目补助资金不超过100万元。",type:"资金",ben:"地方标准或北京团体标准转化国际、国家标准立项可获补助，申报主体限技术对口单位或标委会秘书处承担单位",inds:["科技服务业"],district:null,key:"::首都标准化战略补助资金（标准转化）"},{name:"首都标准化战略补助资金（标准项目）",dept:"北京市市场监督管理局",cat:"资金",auth:"北京市市场监督管理局",time:"3—5月",cond:"【原文出处】《实施首都标准化战略补助资金管理办法》（京市监发〔2024〕52号，北京市市场监督管理局、北京市财政局）：第九条 补助资金支持的标准项目是指正式发布的国际标准、国家标准、行业标准、地方标准和团体标准。第十条 国际标准、国家标准、行业标准、地方标准、团体标准应于补助申报的上一年度正式实施（以标准公告公布的标准实施时间为准）；行业标准、本市地方标准应经过国家标准化管理委员会备案；团体标准还应在全国团体标准信息平台进行公开，并在产业政策制定、行政管理、政府采购、公共管理等工作中应用。第十一条 标准项目补助范围和额度如下：（一）国际标准择优分三档给予补助资金：100万元、50万元和30万元；（二）国家标准择优分三档给予补助资金：30万元、20万元和15万元；（三）行业标准择优分三档给予补助资金：20万元、15万元和10万元；（四）本市地方标准择优分三档给予补助资金：20万元、15万元和10万元；（五）团体标准择优分三档给予补助资金：20万元、15万元和10万元。京津冀区域协同标准在相应档次上增加补助资金5万元。第十二条 标准项目补助资金申报应由标准编制排名第一的起草单位提出，补助资金的分配和使用由申报单位与其他起草单位自行协商确定。同一单位年度标准项目补助资金不超过100万元。",type:"资金",ben:"以第一起草单位申报，标准发布实施后按档补助，年度最高100万元",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::首都标准化战略补助资金（标准项目）"},{name:"高新技术企业认定",dept:"市科委/中关村管委会",cat:"资质",auth:"北京市科委、中关村管委会",time:"按当年通知为准",cond:"【原文出处】《高新技术企业认定管理办法》（国科发火〔2016〕32号）第十一条：（一）企业申请认定时须注册成立一年以上；（二）企业通过自主研发、受让、受赠、并购等方式，获得对其主要产品（服务）在技术上发挥核心支持作用的知识产权的所有权；（三）对企业主要产品（服务）发挥核心支持作用的技术属于《国家重点支持的高新技术领域》规定的范围；（四）企业从事研发和相关技术创新活动的科技人员占企业当年职工总数的比例不低于10%；（五）企业近三个会计年度的研究开发费用总额占同期销售收入总额的比例：最近一年销售收入小于5000万元（含）的企业不低于5%，5000万元至2亿元（含）的不低于4%，2亿元以上的不低于3%；且企业在中国境内发生的研究开发费用总额占全部研究开发费用总额的比例不低于60%；（六）近一年高新技术产品（服务）收入占企业同期总收入的比例不低于60%；（七）企业创新能力评价应达到相应要求；（八）企业申请认定前一年内未发生重大安全、重大质量事故或严重环境违法行为。高新技术企业资格自颁发证书之日起有效期3年，到期需重新认定。",type:"资质",ben:"企业所得税按15%优惠税率征收，且是多项政策申报的前置资格",inds:["制造业","软件业","科技服务业","医疗","机器人"],district:null,key:"::高新技术企业认定"},{name:"高端医疗装备推广应用项目",dept:"工信部",cat:"资质",auth:"工业和信息化部（会同国家卫生健康委、国家药监局）",time:"9—10月",cond:"工信部、国家卫生健康委、国家药监局《关于开展高端医疗装备推广应用项目申报工作的通知》（工信厅联通装函〔2025〕391号）：面向重点产品清单和典型场景清单，由医疗装备生产企业、医疗机构等组成医工联合体申报，经地方推荐、三部门评审遴选公布，入选项目实施周期一般不超过3年。",type:"资质",ben:"国家级推广应用遴选认定，医工联合体申报，获得高端医疗装备临床推广背书",inds:["医疗"],district:null,key:"::高端医疗装备推         var inner;

          inner = esc(t.text.slice(0, idx)) + '<span class="yr">' + esc(ys) + "</span>" + esc(t.text.slice(idx + ys.length));
        } else {
          inner = esc(t.text);
        }
        return '<span class="card-timing">' + inner + "</span>";
      }

      /* ---------------- 渲染 ---------------- */

      function stepperHtml() {
        var h = '<ol class="steps" aria-label="办理进度">';
        STEP_LABELS.forEach(function (label, i) {
          var n = i + 1;
          var state = n === S.step ? "current" : n < S.step ? "done" : "todo";
          var clickable = n <= S.maxStep && n !== S.step;
          h += '<li>';
          if (i > 0) h += '<span class="bar' + (n <= S.step ? " done" : "") + '" aria-hidden="true"></span>';
          h += '<button type="button" class="step-dot ' + state + (clickable ? " clickable" : "") + '"' +
            (clickable ? ' onclick="App.go(' + n + ')"' : " disabled") +
            ' aria-label="第 ' + n + ' 步：' + label + '"' +
            (state === "current" ? ' aria-current="step"' : "") + ">" +
            (state === "done" ? "✓" : n) + "</button>";
          h += '<span class="step-label' + (state === "current" ? " current" : "") + '">' + label + "</span>";
          h += "</li>";
        });
        return h + "</ol>";
      }

      function fieldHtml(label, inner) {
        return '<div class="field"><span class="flabel">' + esc(label) + "</span>" + inner + "</div>";
      }
      function inputHtml(id, value, placeholder, inputmode) {
        return '<input id="' + id + '" class="inp" value="' + esc(value) + '"' +
          (placeholder ? ' placeholder="' + esc(placeholder) + '"' : "") +
          (inputmode ? ' inputmode="' + inputmode + '"' : "") +
          ' oninput="App.set(\'' + id + '\', this.value)" />';
      }
      function districtSelectHtml(id) {
        var h = '<select id="' + id + '" class="inp" onchange="App.set(\'district\', this.value)"><option value="">请选择所在区</option>';
        PM.DISTRICTS.forEach(function (d) {
          h += '<option value="' + esc(d) + '"' + (S.district === d ? " selected" : "") + ">" + esc(d) + "</option>";
        });
        return h + "</select>";
      }
      function navHtml(backStep, nextFn, nextLabel, nextDisabled) {
        return '<div class="navrow">' +
          '<button type="button" class="btn btn-outline" onclick="App.go(' + backStep + ')">← 上一步</button>' +
          '<button type="button" class="btn btn-primary" onclick="App.' + nextFn + '()"' +
          (nextDisabled ? " disabled" : "") + ">" + esc(nextLabel) + "</button></div>";
      }

      function step1Html() {
        return '<section aria-label="第 1 步：输入企业名称">' +
          '<h1 class="title">先输入企业全称</h1>' +
          '<p class="intro">把企业基本信息填好，再补几个关键数，就能看到贵公司可以申报哪些政策，' +
          '并一键生成专属的《项目规划书》。全程不用懂政策，按提示填就行。</p>' +
          '<label class="field" style="margin-top:1.5rem"><span class="flabel">企业全称</span>' +
          '<input id="name" class="inp" value="' + esc(S.name) + '" placeholder="如：北京某某科技有限公司" ' +
          'oninput="App.set(\'name\', this.value)" onkeydown="if(event.key===\'Enter\'){App.submitName();}" /></label>' +
          (S.nameError ? '<p class="alert-inline" role="alert">' + esc(S.nameError) + "</p>" : "") +
          '<div style="margin-top:1.25rem"><button type="button" class="btn btn-primary" onclick="App.submitName()">下一步：填写企业信息 →</button></div>' +
          '<p class="note-xs" style="margin-top:1rem">政策库共 299 条：市级/国家级 79 条 + 北京 16 区区级 220 条。</p>' +
          "</section>";
      }

      function step2Html() {
        var catOpts = '<option value="">请选择门类</option>';
        PM.GB_CATEGORIES.forEach(function (c) {
          catOpts += '<option value="' + c.letter + '"' + (S.industryCat === c.letter ? " selected" : "") + ">" +
            c.letter + " " + esc(c.name) + "</option>";
        });
        var cat = PM.findCategory(S.industryCat);
        var majorOpts = '<option value="">请选择大类</option>';
        if (cat) cat.majors.forEach(function (m) {
          majorOpts += '<option value="' + m.code + '"' + (S.industryMajor === m.code ? " selected" : "") + ">" +
            m.code + " " + esc(m.name) + "</option>";
        });
        return '<section aria-label="第 2 步：填写企业基本信息">' +
          '<h1 class="title">填写企业基本信息</h1>' +
          '<p class="intro">按营业执照和实际情况填写即可，拿不准的可以先空着。' +
          '其中「所在区」和「所属行业」会影响匹配到的政策范围，建议尽量选上。</p>' +
          '<div class="stack" style="margin-top:1.25rem">' +
          fieldHtml("企业名称", inputHtml("name", S.name, "企业全称")) +
          '<div class="grid2">' +
          fieldHtml("成立年份", inputHtml("foundedYear", S.foundedYear, "如 2016", "numeric")) +
          fieldHtml("注册资本", inputHtml("registeredCapital", S.registeredCapital, "如 1000万元")) +
          "</div>" +
          fieldHtml("注册地址", inputHtml("registeredAddress", S.registeredAddress, "注册地址原文")) +
          '<div class="grid2">' +
          fieldHtml("所在区", districtSelectHtml("district2")) +
          fieldHtml("法定代表人", inputHtml("legalRep", S.legalRep, "")) +
          "</div>" +
          '<div class="grid2">' +
          fieldHtml("所属行业（门类）",
            '<select id="industryCat" class="inp" onchange="App.setCat(this.value)">' + catOpts + "</select>") +
          fieldHtml("所属行业（大类）",
            '<select id="industryMajor" class="inp" onchange="App.set(\'industryMajor\', this.value)"' +
            (S.industryCat ? "" : " disabled") + ">" + majorOpts + "</select>") +
          "</div>" +
          "</div>" +
          navHtml(1, "goDirect(3)", "下一步：补关键数 →", false) +
          "</section>";
      }

      function step3Html() {
        var quals = PM.QUALIFICATION_OPTIONS.map(function (q) {
          var checked = S.qualifications.indexOf(q) >= 0;
          return '<label class="qual-chip' + (checked ? " checked" : "") + '">' +
            '<input type="checkbox"' + (checked ? " checked" : "") +
            ' onchange="App.toggleQual(this, \'' + esc(q) + '\')" />' + esc(q) + "</label>";
        }).join("");
        return '<section aria-label="第 3 步：补录关键数">' +
          '<h1 class="title">补几个关键数</h1>' +
          '<p class="intro">下面 6 项全部选填：知道多少填多少。留空的那些，相关政策会标「待确认」，' +
          '不会乱判。填得越全，匹配越准。</p>' +
          '<div class="stack" style="margin-top:1.25rem">' +
          fieldHtml("所在区（区级政策按这个区匹配）", districtSelectHtml("district3")) +
          '<div class="grid2">' +
          fieldHtml("上一年营业收入（万元）", inputHtml("revenue", S.revenue, "如 8000", "decimal")) +
          fieldHtml("上一年研发费用（万元）", inputHtml("rdExpense", S.rdExpense, "如 900", "decimal")) +
          "</div>" +
          '<div class="grid2">' +
          fieldHtml("员工总数（人）", inputHtml("employees", S.employees, "如 120", "numeric")) +
          fieldHtml("其中研发人员（人）", inputHtml("rdStaff", S.rdStaff, "如 45", "numeric")) +
          "</div>" +
          '<div class="grid3">' +
          fieldHtml("发明专利（件）", inputHtml("inventionPatents", S.inventionPatents, "如 12", "numeric")) +
          fieldHtml("专利总数（件）", inputHtml("totalPatents", S.totalPatents, "如 40", "numeric")) +
          fieldHtml("软件著作权（件）", inputHtml("softwareCopyrights", S.softwareCopyrights, "如 8", "numeric")) +
          "</div>" +
          '<fieldset class="qual"><legend>已获荣誉资质（有的勾上）</legend><div class="qual-grid">' + quals + "</div></fieldset>" +
          fieldHtml("主导产品（一句话，会写进规划书概况）",
            inputHtml("mainProduct", S.mainProduct, "如：颅内取栓支架、血流导向密网支架等神经介入器械")) +
          "</div>" +
          (S.stepError ? '<p class="alert" role="alert">' + esc(S.stepError) + "</p>" : "") +
          navHtml(2, "toResults()", "看匹配结果 →", false) +
          "</section>";
      }

      function cardHtml(r, p, opts) {
        opts = opts || {};
        var expanded = S.expandedKey === r.policy.key;
        var badge = '<span class="badge ' + STATUS_CLASS[r.status] + '">' +
          (r.status === "已持有" ? "✓ 已持有" : r.status) + "</span>";
        var h = '<div class="card"' + (opts.draggable ? ' draggable="true" data-key="' + esc(r.policy.key) + '"' : "") + ">" +
          '<div class="card-head">' +
          '<button type="button" class="card-main" aria-expanded="' + expanded + '" onclick="App.toggleCard(\'' + esc(r.policy.key) + '\')">' +
          '<span class="card-name">' + esc(r.policy.name) + "</span>" + badge +
          '<span class="card-line">' + esc(PM.oneLiner(r)) + "</span>" +
          (opts.subNote ? '<span class="card-sub">' + esc(opts.subNote) + "</span>" : "") +
          timingHtml(r, p) +
          "</button>" +
          (opts.actions ? '<div class="card-actions">' + opts.actions + "</div>" : "") +
          "</div>";
        if (expanded) {
          var t = PM.suggestTiming(r.policy, r, p);
          h += '<div class="card-detail">' +
            "<p><b>主管部门：</b>" + esc(r.policy.auth) + "（归口：" + esc(r.policy.dept) + "）</p>" +
            "<p><b>项目类型：</b>" + esc(r.policy.type) + " · " + esc(r.policy.cat) + "</p>" +
            "<p><b>预计申报时间：</b>" + esc(r.policy.time) + (t ? "；" + esc(t.text) : "") + "</p>";
          if (r.gaps.length > 0) {
            h += "<div><b>差在哪：</b><ul>" + r.gaps.map(function (g) { return "<li>" + esc(g.text) + "</li>"; }).join("") + "</ul></div>";
          }
          if (r.missing.length > 0) {
            h += "<div><b>还缺的信息：</b><ul>" + r.missing.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul></div>";
          }
          h += "<p><b>基本条件：</b>" + esc(r.policy.cond) + "</p>" +
            "<p><b>项目利好：</b>" + esc(r.policy.ben) + "</p>";
          if (r.notes.length > 0) h += '<p class="notes">' + esc(r.notes.join("；")) + "</p>";
          h += "</div>";
        }
        return h + "</div>";
      }

      function step4Html() {
        var p = profile();
        var results = computeResults();
        var included = includedOf(results);
        var held = results.filter(function (r) { return r.status === "已持有"; });
        var excluded = results.filter(function (r) { return r.status !== "已持有" && S.removed[r.policy.key]; });
        var indLabel = PM.industryFullLabel(p);
        var h = '<section aria-label="第 4 步：匹配结果">' +
          '<h1 class="title">匹配结果</h1>' +
          '<p class="intro">' + esc(p.name) + " · " + esc(p.district) +
          (indLabel ? " · " + esc(indLabel) : "") +
          "。共匹配 " + results.length + " 条：已纳入 " + included.length + " 条、未纳入 " +
          excluded.length + " 条、已持有 " + held.length + " 条。</p>";
        if (!PM.hasSpecificBuckets(p)) {
          h += '<p class="warn-box">当前行业' + (p.industryCat || p.industryMajor ? "暂无专项政策口径" : "未选择") +
            '，现在只匹配全行业通用政策；回第 2 步选上行业大类，还能补出该行业的专项政策。</p>';
        }
        h += '<h2 class="zone">已纳入（' + included.length + " 条，将写进规划书）</h2>";
        if (included.length === 0) {
          h += '<p class="intro">还没有纳入的项目。可以从下面「未纳入」里加回，或回上一步补数据再匹配。</p>';
        }
        h += '<div class="cards" id="included-cards">';
        included.forEach(function (r, i) {
          var actions =
            '<button type="button" class="mini-btn" aria-label="上移 ' + esc(r.policy.name) + '"' +
            (i === 0 ? " disabled" : "") + ' onclick="App.move(\'' + esc(r.policy.key) + '\', -1)">↑</button>' +
            '<button type="button" class="mini-btn" aria-label="下移 ' + esc(r.policy.name) + '"' +
            (i === included.length - 1 ? " disabled" : "") + ' onclick="App.move(\'' + esc(r.policy.key) + '\', 1)">↓</button>' +
            '<button type="button" class="mini-btn remove" onclick="App.remove(\'' + esc(r.policy.key) + '\')">去掉</button>';
          h += cardHtml(r, p, { draggable: true, actions: actions });
        });
        h += "</div>";

        if (excluded.length > 0) {
          h += '<button type="button" class="zone-toggle" aria-expanded="' + S.showExcluded +
            '" onclick="App.toggleZone(\'showExcluded\')">未纳入（' + excluded.length + " 条）" + (S.showExcluded ? " ▾" : " ▸") + "</button>";
          if (S.showExcluded) {
            h += '<div class="cards">';
            excluded.forEach(function (r) {
              h += cardHtml(r, p, {
                subNote: "您手动去掉的",
                actions: '<button type="button" class="mini-btn addback" onclick="App.addBack(\'' + esc(r.policy.key) + '\')">加回</button>'
              });
            });
            h += "</div>";
          }
        }
        if (held.length > 0) {
          h += '<button type="button" class="zone-toggle" aria-expanded="' + S.showHeld +
            '" onclick="App.toggleZone(\'showHeld\')">已持有（' + held.length + " 条）" + (S.showHeld ? " ▾" : " ▸") + "</button>";
          if (S.showHeld) {
            h += '<div class="cards">';
            held.forEach(function (r) { h += cardHtml(r, p, {}); });
            h += "</div>";
          }
        }
        h += navHtml(3, "goDirect(5)", "下一步：确认出书 →", included.length === 0);
        return h + "</section>";
      }

      function step5Html() {
        var p = profile();
        var results = computeResults();
        var included = includedOf(results);
        var rows = PM.buildOverviewRows(p, S.overviewOverrides);
        var h = '<section aria-label="第 5 步：确认并生成规划书">' +
          '<h1 class="title">确认后生成规划书</h1>' +
          '<p class="intro">左边是将写进规划书的项目（按这个顺序），右边是企业概况将填入的内容。' +
          '概况里空着的格子标了底色，可以当场补；实在没有就空着出书，不会替您编。</p>' +
          '<div class="split"><div>' +
          '<h2>项目清单（' + included.length + ' 条）</h2><ol class="plan-list">';
        included.forEach(function (r, i) {
          h += '<li class="plan-item"><span class="no">' + (i + 1) + '</span>' +
            '<span class="grow"><span class="nm">' + esc(r.policy.name) + '</span>' +
            '<span class="meta">' + esc(r.policy.dept) + " · " + esc(PM.planYear(r, p)) + "</span></span>" +
            '<span class="badge sm ' + STATUS_CLASS[r.status] + '">' + r.status + "</span></li>";
        });
        h += "</ol>";
        if (included.length === 0) h += '<p class="intro">清单是空的，请回第 4 步纳入项目后再出书。</p>';
        h += '</div><div><h2>企业概况（将填入规划书）</h2><dl class="ov-table">';
        rows.forEach(function (row) {
          var empty = row.value.trim() === "";
          var editable = row.label !== "沟通记录" && row.label !== "企业名称";
          h += '<div class="ov-row' + (empty ? " empty" : "") + '"><dt>' + esc(row.label) + "</dt><dd>";
          if (empty && editable) {
            h += '<input class="ov-fill" aria-label="补填' + esc(row.label) + '" placeholder="空缺，可当场补填" value="' +
              esc(S.overviewOverrides[row.label] || "") +
              '" oninput="App.setOverride(\'' + esc(row.label) + '\', this.value)" />';
          } else {
            h += '<span class="pre">' + esc(row.value || "（空）") + "</span>";
          }
          h += "</dd></div>";
        });
        h += "</dl></div></div>";
        if (S.generated) {
          h += '<p class="ok-box" role="status">规划书已生成并开始下载，文件名《' + esc(p.name) +
            '-项目规划书.docx》，用 Word 或 WPS 打开即可。如需调整，点「上一步」回匹配结果改完再重新生成。</p>';
        }
        if (S.genError) {
          h += '<p class="alert" role="alert">' + esc(S.genError) + "</p>";
        }
        h += '<div class="navrow">' +
          '<button type="button" class="btn btn-outline" onclick="App.go(4)">← 上一步</button>' +
          '<button type="button" class="btn btn-primary" onclick="App.generate()"' +
          (included.length === 0 ? " disabled" : "") + ">生成我的规划书（下载）</button>" +
          '<button type="button" class="btn-link" onclick="App.restart()">重新开始</button>' +
          "</div></section>";
        return h;
      }

      function render() {
        var app = document.getElementById("app");
        var body = "";
        if (S.step === 1) body = step1Html();
        else if (S.step === 2) body = step2Html();
        else if (S.step === 3) body = step3Html();
        else if (S.step === 4) body = step4Html();
        else body = step5Html();
        app.innerHTML = stepperHtml() + '<div class="gold-rule" aria-hidden="true"></div>' + body;
        bindDrag();
        renderToast();
      }

      function renderToast() {
        var slot = document.getElementById("toast-slot");
        if (undoInfo && S.step === 4) {
          slot.innerHTML = '<div class="toast" role="status"><span class="tname">已去掉《' +
            esc(undoInfo.name) + '》</span><button type="button" onclick="App.undoRemove()">撤销</button></div>';
        } else {
          slot.innerHTML = "";
        }
      }

      function bindDrag() {
        var cards = document.querySelectorAll("#included-cards .card[draggable]");
        Array.prototype.forEach.call(cards, function (el) {
          el.addEventListener("dragstart", function () { dragKey = el.getAttribute("data-key"); });
          el.addEventListener("dragover", function (e) { e.preventDefault(); });
          el.addEventListener("drop", function (e) {
            e.preventDefault();
            App.dropOnto(el.getAttribute("data-key"));
          });
        });
      }

      /* ---------------- 动作 ---------------- */

      window.App = {
        set: function (key, value) {
          S[key] = value;
          if (key === "name") S.nameError = "";
        },
        setCat: function (value) {
          S.industryCat = value;
          S.industryMajor = "";
          render();
        },
        toggleQual: function (el, q) {
          var i = S.qualifications.indexOf(q);
          if (el.checked && i < 0) S.qualifications.push(q);
          if (!el.checked && i >= 0) S.qualifications.splice(i, 1);
          var label = el.closest("label");
          if (label) label.classList.toggle("checked", el.checked);
        },
        go: function (n) {
          S.step = n;
          if (n > S.maxStep) S.maxStep = n;
          S.stepError = "";
          window.scrollTo({ top: 0 });
          render();
        },
        goDirect: function (n) { App.go(n); },
        submitName: function () {
          if (!S.name.trim()) { S.nameError = "先填企业全称，再继续"; render(); return; }
          S.nameError = "";
          App.go(2);
        },
        toResults: function () {
          if (!S.name.trim()) { S.stepError = "企业名称还没填，请回第 1 步补上"; render(); return; }
          if (!S.district) { S.stepError = "所在区还没选：区级政策要按所在区匹配，请先选所在区"; render(); return; }
          S.stepError = "";
          App.go(4);
        },
        toggleCard: function (key) {
          S.expandedKey = S.expandedKey === key ? null : key;
          render();
        },
        toggleZone: function (which) {
          S[which] = !S[which];
          render();
        },
        remove: function (key) {
          var results = computeResults();
          var r = null;
          results.forEach(function (x) { if (x.policy.key === key) r = x; });
          S.removed[key] = true;
          undoInfo = { key: key, name: r ? r.policy.name : "" };
          if (undoTimer) clearTimeout(undoTimer);
          undoTimer = setTimeout(function () { undoInfo = null; renderToast(); }, 6000);
          render();
        },
        undoRemove: function () {
          if (!undoInfo) return;
          delete S.removed[undoInfo.key];
          undoInfo = null;
          if (undoTimer) clearTimeout(undoTimer);
          render();
        },
        addBack: function (key) {
          delete S.removed[key];
          render();
        },
        move: function (key, dir) {
          var included = includedOf(computeResults());
          var keys = included.map(function (r) { return r.policy.key; });
          var i = keys.indexOf(key), j = i + dir;
          if (i < 0 || j < 0 || j >= keys.length) return;
          var moved = keys.splice(i, 1)[0];
          keys.splice(j, 0, moved);
          S.orderKeys = keys;
          render();
        },
        dropOnto: function (targetKey) {
          var from = dragKey;
          dragKey = null;
          if (!from || from === targetKey) return;
          var included = includedOf(computeResults());
          var keys = included.map(function (r) { return r.policy.key; });
          var fi = keys.indexOf(from), ti = keys.indexOf(targetKey);
          if (fi < 0 || ti < 0) return;
          var moved = keys.splice(fi, 1)[0];
          keys.splice(ti, 0, moved);
          S.orderKeys = keys;
          render();
        },
        setOverride: function (label, value) {
          S.overviewOverrides[label] = value;
        },
        generate: function () {
          var p = profile();
          var included = includedOf(computeResults());
          if (included.length === 0) return;
          try {
            PM.generatePlanDoc(p, included, S.overviewOverrides);
            S.generated = true;
            S.genError = "";
          } catch (e) {
            S.generated = false;
            S.genError = "规划书生成失败，请刷新页面后重试。";
          }
          render();
        },
        restart: function () {
          S = {
            step: 1, maxStep: 1,
            name: "", foundedYear: "", registeredCapital: "", registeredAddress: "",
            district: "", industryCat: "", industryMajor: "", legalRep: "",
            revenue: "", rdExpense: "", employees: "", rdStaff: "",
